server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    # Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # index.html ne doit jamais etre mis en cache (contient les refs aux assets)
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Cache long sur les assets Vite (ils ont un hash dans le nom)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Upload HD → S3 (service Node interne, port non exposé à l'extérieur)
    location /s3-upload/ {
        client_max_body_size 60m;
        proxy_pass http://127.0.0.1:4000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy API prod
    location /api/ {
        proxy_pass https://api.chazal.com/api/;
        proxy_set_header Host api.chazal.com;
        proxy_ssl_server_name on;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect http://api.chazal.com/ /api/;
        proxy_redirect https://api.chazal.com/ /api/;
    }

    # Proxy API dev
    location /api-dev/ {
        proxy_pass https://api-dev.chazal.com/api/;
        proxy_set_header Host api-dev.chazal.com;
        proxy_ssl_server_name on;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect http://api-dev.chazal.com/ /api-dev/;
        proxy_redirect https://api-dev.chazal.com/ /api-dev/;
    }

    # SPA routing — toutes les routes vers index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
